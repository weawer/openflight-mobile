name: iOS

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  shared-framework:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
      - name: Test the shared iOS simulator target
        run: ./gradlew :shared:iosSimulatorArm64Test

  native-app:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
      - name: Build
        run: >-
          xcodebuild build
          -project iosApp/OpenFlight.xcodeproj
          -scheme OpenFlight
          -destination "generic/platform=iOS Simulator"
          CODE_SIGNING_ALLOWED=NO
      - name: Select an iPhone simulator
        run: |
          DEVICE_ID="$(xcrun simctl list devices available |
            sed -nE 's/.*iPhone.*\(([0-9A-F-]{36})\).*/\1/p' |
            head -1)"
          test -n "$DEVICE_ID"
          echo "DEVICE_ID=$DEVICE_ID" >> "$GITHUB_ENV"
      - name: Run unit tests
        run: >-
          xcodebuild test
          -project iosApp/OpenFlight.xcodeproj
          -scheme OpenFlight
          -destination "id=$DEVICE_ID"
          -only-testing:OpenFlightTests
          CODE_SIGNING_ALLOWED=NO
